[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "language-leveller"
version = "0.1.0"
description = "Rank the vocabulary and grammar of any text by CEFR level, for any language with a frequency list and a grammar profile."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
spacy = ["spacy>=3.7"]
stanza = ["stanza>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
leveller = "language_leveller.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
